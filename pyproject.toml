[project]
name = "stable-worldmodel"
version = "0.0.6"
description = "World Model Research Made Simple"
readme="README.md"
license="MIT"
authors = [{name = "Lucas Maes"}, {name = "Quentin Le Lidec"}, {name = "Randall Balestriero"}]
maintainers = [{name = "Lucas Maes", email = "lucas_maes@brown.edu"}]
urls = {Homepage = "http://github.com/galilai-group/stable-worldmodel"}
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = [
  "torch",
  "torchvision",
  "numpy",
  "loguru",
  "tabulate",
  "gymnasium",
  "einops",
  # Beta wheels live on Gemfury (see [[tool.uv.index]] entries below); these
  # are the first releases that ship the `hf://buckets/...` object_store
  # provider, so swm can stream training datasets directly from HF Buckets.
  "lancedb>=0.33.0b1",
  "pylance>=7.1.0b2",
  "pyarrow",
  "pillow",
  "tqdm",
  "typer",
  "rich",
]

[project.scripts]
swm = "stable_worldmodel.cli:app"

[project.optional-dependencies]
train = [
    "transformers>=4.50.0",
    "stable-pretraining",
    "hydra-core",
    "hydra-submitit-launcher",
    "wandb",
]

env = [
    "pygame",
    "pymunk",
    "shapely",
    "ogbench",
    "minigrid",
    "gymnasium[all]",
    "gymnasium-robotics",
    "opencv-python",
    "stable_baselines3>=2.0.0",
    "craftax>=1.5.0",
    "ale-py",
]

format = [
    "lerobot>=0.5.0; python_version >= '3.12'",
    "h5py",
    "hdf5plugin",
    "decord",
    "imageio[ffmpeg]",
]

[dependency-groups]
dev = [
  "ipdb",
  "pytest",
  "pytest-cov>=7.0.0",
  "ruff",
  "twine",
  "mkdocs-shadcn",
  "pymdown-extensions",
  "pillow",
  "decord",
  "imageio[ffmpeg]",
  "mkdocstrings[python]",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
source-exclude = [
    "**/.mypy_cache/**",
    "**/__pycache__/**",
    "**/*.pyc",
]

# Resolve the lance + lancedb beta wheels (which carry the hf://buckets/
# object_store provider) from their respective Gemfury indices. PyPI's
# latest stable releases (lancedb 0.30, pylance 6.0) predate HF Buckets
# support, so users would otherwise have to add --extra-index-url manually.
[[tool.uv.index]]
name = "lance-format"
url = "https://pypi.fury.io/lance-format/"
explicit = true

[[tool.uv.index]]
name = "lancedb"
url = "https://pypi.fury.io/lancedb/"
explicit = true

[tool.uv.sources]
pylance = { index = "lance-format" }
lancedb = { index = "lancedb" }

[tool.ruff]
line-length = 79
indent-width = 4

[tool.ruff.format]
indent-style = "space"
quote-style = "single"

[tool.coverage.run]
omit = ["stable_worldmodel/envs/*"]
